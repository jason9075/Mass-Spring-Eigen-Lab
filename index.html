<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mass-Spring Eigen Lab</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ]
          });"></script>

  <!-- Prism.js Nord theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prism-themes@1.9.0/themes/prism-nord.css" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>

  <!-- math.js for eigendecomposition -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>

  <!-- Three.js Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three":   "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
    }
  }
  </script>

  <style>
    :root {
      --nord0:  #2E3440; --nord1:  #3B4252; --nord2:  #434C5E;
      --nord3:  #4C566A; --nord4:  #D8DEE9; --nord5:  #E5E9F0;
      --nord6:  #ECEFF4; --nord7:  #8FBCBB; --nord8:  #88C0D0;
      --nord9:  #81A1C1; --nord10: #5E81AC; --nord11: #BF616A;
      --nord12: #D08770; --nord13: #EBCB8B; --nord14: #A3BE8C;
      --nord15: #B48EAD;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--nord0);
      color: var(--nord4);
      font-family: 'JetBrains Mono', monospace, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    canvas { display: block; }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed;
      top: 1rem;
      left: 1rem;
      display: flex;
      gap: 0.6rem;
      align-items: center;
      padding: 0.6rem 1rem;
      border: 1px solid var(--nord3);
      border-radius: 999px;
      background: rgba(59, 66, 82, 0.9);
      backdrop-filter: blur(12px);
      z-index: 20;
      white-space: nowrap;
    }

    .tb-btn {
      font: inherit;
      font-size: 0.8rem;
      border: 1px solid var(--nord3);
      border-radius: 999px;
      background: var(--nord1);
      color: var(--nord6);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .tb-btn:hover { background: var(--nord2); border-color: var(--nord8); }
    .tb-btn.active { background: var(--nord10); border-color: var(--nord8); color: var(--nord6); }

    .tb-sep { width: 1px; height: 1.2rem; background: var(--nord3); }

    .icon-btn {
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
    }

    /* ── Matrix Board ── */
    #matrix-board {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      background: rgba(59, 66, 82, 0.88);
      border: 1px solid var(--nord3);
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      backdrop-filter: blur(10px);
      font-size: 0.78rem;
      z-index: 20;
      min-width: 220px;
    }

    .board-title {
      color: var(--nord8);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.55rem;
    }

    .board-matrix {
      font-family: monospace;
      color: var(--nord5);
      line-height: 1.8;
      margin-bottom: 0.6rem;
    }

    .board-matrix .bracket { color: var(--nord3); }
    .board-matrix .val { color: var(--nord13); min-width: 4ch; display: inline-block; text-align: right; }

    .board-eigen {
      border-top: 1px solid var(--nord3);
      padding-top: 0.5rem;
      display: grid;
      gap: 0.3rem;
      color: var(--nord5);
    }

    .board-eigen .ev1 { color: var(--nord8); }
    .board-eigen .ev2 { color: var(--nord12); }

    /* ── Modal ── */
    #math-modal[hidden] { display: none; }

    #math-modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(46, 52, 64, 0.78);
      z-index: 50;
    }

    .modal-panel {
      width: min(740px, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      overflow: auto;
      background: var(--nord1);
      border: 1px solid var(--nord3);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      padding: 1.4rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-header h2 { font-size: 1rem; color: var(--nord8); }

    .modal-actions { display: flex; gap: 0.5rem; }

    .modal-toggle {
      font: inherit;
      font-size: 0.8rem;
      border: 1px solid var(--nord3);
      border-radius: 999px;
      background: var(--nord1);
      color: var(--nord6);
      padding: 0.4rem 0.8rem;
      cursor: pointer;
    }

    .modal-body {
      display: grid;
      gap: 0.85rem;
      line-height: 1.75;
      color: var(--nord5);
    }

    .modal-body pre[class*="language-"] {
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.8rem;
      margin: 0;
    }

    /* ── Matrix Board ── */
    #matrix-board {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      z-index: 20;
    }

    /* ── Drag hint ── */
    #drag-hint {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      color: var(--nord3);
      font-size: 0.72rem;
      z-index: 20;
    }

    /* ── Scene labels ── */
    .scene-label {
      position: fixed;
      pointer-events: none;
      z-index: 15;
      transform: translate(-50%, -50%);
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      text-shadow: 0 0 6px var(--nord0), 0 0 12px var(--nord0);
    }

    .mass-label {
      color: var(--nord13);
      font-weight: bold;
      font-size: 0.85rem;
    }

    .spring-label {
      color: var(--nord3);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <!-- GitHub Ribbon -->
  <a href="https://github.com/jason9075/Mass-Spring-Eigen-Lab" target="_blank" rel="noopener">
    <img loading="lazy" decoding="async" width="149" height="149"
         style="position:fixed;top:0;right:0;border:0;z-index:9999;"
         src="https://github.blog/wp-content/uploads/2008/12/forkme_right_darkblue_121621.png"
         alt="Fork me on GitHub">
  </a>

  <!-- Toolbar -->
  <div id="toolbar" aria-label="Simulation controls">
    <button id="btn-swing"   class="tb-btn" type="button">The Swing</button>
    <button id="btn-stretch" class="tb-btn"         type="button">The Stretch</button>
    <div class="tb-sep"></div>
    <button id="btn-reset"   class="tb-btn"         type="button">Reset</button>
    <button id="btn-pause"   class="tb-btn"         type="button">Pause</button>
    <div class="tb-sep"></div>
    <button id="open-math" class="tb-btn icon-btn" type="button"
            aria-haspopup="dialog" aria-label="Explain the math">💡</button>
  </div>

  <!-- Three.js canvas -->
  <canvas id="canvas"></canvas>

  <!-- Stiffness matrix display -->
  <div id="matrix-board" aria-label="Live stiffness matrix">
    <div class="board-title">Stiffness Matrix K</div>
    <div class="board-matrix">
      <div>
        <span class="bracket">⎡</span>
        <span class="val" id="k11">25</span>
        <span style="color:var(--nord3)">  </span>
        <span class="val" id="k12">-10</span>
        <span class="bracket">⎤</span>
      </div>
      <div>
        <span class="bracket">⎣</span>
        <span class="val" id="k21">-10</span>
        <span style="color:var(--nord3)">  </span>
        <span class="val" id="k22">10</span>
        <span class="bracket">⎦</span>
      </div>
    </div>
    <div class="board-eigen">
      <div class="ev1">λ₁ = <span id="lam1">5.00</span> &nbsp; f₁ = <span id="freq1">0.356</span> Hz</div>
      <div class="ev2">λ₂ = <span id="lam2">30.00</span> &nbsp; f₂ = <span id="freq2">0.872</span> Hz</div>
    </div>
  </div>

  <div id="drag-hint">drag mass A or B to perturb</div>

  <!-- Scene labels (positioned via JS each frame) -->
  <div class="scene-label mass-label" id="label-a">A</div>
  <div class="scene-label mass-label" id="label-b">B</div>
  <div class="scene-label spring-label" id="label-s1">Spring 1</div>
  <div class="scene-label spring-label" id="label-s2">Spring 2</div>

  <!-- Math Modal -->
  <div id="math-modal" role="dialog" aria-modal="true" aria-labelledby="math-title" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="math-title">Math Behind the Scene</h2>
        <div class="modal-actions">
          <button id="lang-toggle" class="modal-toggle" type="button">Eng/中</button>
          <button id="close-math"  class="modal-toggle" type="button">Close</button>
        </div>
      </div>
      <div id="math-content" class="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
